server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    port_in_redirect off;
    client_max_body_size 25m;

    location = / {
        return 302 /enterprise/employees;
    }

    location = /workspace/gallery {
        return 302 /enterprise/resources;
    }

    location = /enterprise/platform {
        return 302 /enterprise/resources;
    }

    location = /enterprise/dashboard {
        return 302 /enterprise/employees;
    }

    location = /enterprise/skills {
        return 302 /enterprise/employees;
    }

    location ~ ^/(api/|docs$|redoc$|openapi\.json$) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 入口页包含带哈希的前端资源清单；禁止缓存入口，避免发布后继续引用旧 bundle。
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }
}
