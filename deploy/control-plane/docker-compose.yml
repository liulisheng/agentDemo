services:
  mysql:
    image: mysql:8.4.10
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-agent_platform}
      MYSQL_USER: ${MYSQL_USER:-agent_platform}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请先配置 deploy/control-plane/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请先配置 deploy/control-plane/.env}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3309}:3306"
    volumes:
      - control_plane_mysql:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  bootstrap:
    image: agent-platform/control-plane-api:local
    build:
      context: ../..
      dockerfile: deploy/control-plane/Dockerfile.backend
    restart: "no"
    environment: &backend_environment
      AGENT_PLATFORM_MODE: mysql
      AGENT_PLATFORM_IDENTITY_PROVIDER: fake
      AGENT_PLATFORM_DATA_ROOT: /var/lib/agent-platform
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-agent_platform}
      MYSQL_USER: ${MYSQL_USER:-agent_platform}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请先配置 deploy/control-plane/.env}
      MYSQL_POOL_SIZE: 8
      AGENT_PLATFORM_TEAM_MAX_WORKERS: ${AGENT_PLATFORM_TEAM_MAX_WORKERS:-${AGENT_PLATFORM_WORKER_REPLICAS:-3}}
      AGENT_PLATFORM_OBJECT_ENCRYPTION_REQUIRED: ${AGENT_PLATFORM_OBJECT_ENCRYPTION_REQUIRED:-0}
      AGENT_PLATFORM_STORAGE_SECRET_REF: ${AGENT_PLATFORM_STORAGE_SECRET_REF:-}
      AGENT_PLATFORM_STORAGE_KEY_VERSION: ${AGENT_PLATFORM_STORAGE_KEY_VERSION:-}
      AGENT_PLATFORM_STORAGE_KEY_B64: ${AGENT_PLATFORM_STORAGE_KEY_B64:-}
    command: ["sh", "-ec", "agent-platform-migration apply && agent-platform-seed-fake-identity"]
    depends_on:
      mysql:
        condition: service_healthy

  backend:
    image: agent-platform/control-plane-api:local
    build:
      context: ../..
      dockerfile: deploy/control-plane/Dockerfile.backend
    restart: unless-stopped
    environment:
      <<: *backend_environment
      AGENT_PLATFORM_RUNTIME_ENGINE: ${AGENT_PLATFORM_RUNTIME_ENGINE:-deepseek}
      AGENT_PLATFORM_DEEPSEEK_PROFILE: ${AGENT_PLATFORM_DEEPSEEK_PROFILE:-sdk-minimal}
      AGENT_PLATFORM_DEEPSEEK_PROVIDER: ${AGENT_PLATFORM_DEEPSEEK_PROVIDER:-deepseek-official}
      AGENT_PLATFORM_DEEPSEEK_MODEL: ${AGENT_PLATFORM_DEEPSEEK_MODEL:-deepseek-v4-flash}
    volumes:
      - control_plane_objects:/var/lib/agent-platform
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    image: agent-platform/control-plane-api:local
    restart: unless-stopped
    deploy:
      replicas: ${AGENT_PLATFORM_WORKER_REPLICAS:-3}
    environment:
      <<: *backend_environment
      AGENT_PLATFORM_RUNTIME_ENGINE: ${AGENT_PLATFORM_RUNTIME_ENGINE:-deepseek}
      AGENT_PLATFORM_DEEPSEEK_PROFILE: ${AGENT_PLATFORM_DEEPSEEK_PROFILE:-sdk-minimal}
      AGENT_PLATFORM_DEEPSEEK_PROVIDER: ${AGENT_PLATFORM_DEEPSEEK_PROVIDER:-deepseek-official}
      AGENT_PLATFORM_DEEPSEEK_MODEL: ${AGENT_PLATFORM_DEEPSEEK_MODEL:-deepseek-v4-flash}
      AGENT_PLATFORM_ID: ${AGENT_PLATFORM_ID:-plt-local}
      AGENT_PLATFORM_WORKER_POLL_SECONDS: ${AGENT_PLATFORM_WORKER_POLL_SECONDS:-1}
      AGENT_PLATFORM_WORKER_LEASE_SECONDS: ${AGENT_PLATFORM_WORKER_LEASE_SECONDS:-30}
      AGENT_PLATFORM_WORKER_HEARTBEAT_SECONDS: ${AGENT_PLATFORM_WORKER_HEARTBEAT_SECONDS:-10}
      AGENT_PLATFORM_WORKER_CANCEL_GRACE_SECONDS: ${AGENT_PLATFORM_WORKER_CANCEL_GRACE_SECONDS:-10}
      # 可选按引擎过滤领取队列，例如 deepseek_harness 或 codex_cli；留空时使用该 Worker 注册的全部引擎。
      AGENT_PLATFORM_WORKER_ENGINE_NAMES: ${AGENT_PLATFORM_WORKER_ENGINE_NAMES:-${AGENT_PLATFORM_RUNTIME_ENGINE:-deepseek_harness}}
      # 示例租户 SecretRef 映射只进入 Run Worker，不注入 API/Web 容器。
      AGENT_PLATFORM_MODEL_SECRET_TENANT_A_LOCAL_MODEL_KEY: ${AGENT_PLATFORM_MODEL_SECRET_TENANT_A_LOCAL_MODEL_KEY:-}
    command: ["agent-platform-run-worker"]
    volumes:
      - control_plane_objects:/var/lib/agent-platform
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  approval-worker:
    image: agent-platform/control-plane-api:local
    restart: unless-stopped
    environment:
      <<: *backend_environment
      AGENT_PLATFORM_ID: ${AGENT_PLATFORM_ID:-plt-local}
      AGENT_PLATFORM_TENANT_ID: ${AGENT_PLATFORM_TENANT_ID:-tenant-a}
      AGENT_PLATFORM_APPROVAL_WORKER_ID: ${AGENT_PLATFORM_APPROVAL_WORKER_ID:-approval-worker-local}
      AGENT_PLATFORM_APPROVAL_LEASE_SECONDS: ${AGENT_PLATFORM_APPROVAL_LEASE_SECONDS:-30}
      AGENT_PLATFORM_APPROVAL_POLL_SECONDS: ${AGENT_PLATFORM_APPROVAL_POLL_SECONDS:-1}
      AGENT_PLATFORM_MCP_ALLOWED_COMMANDS: ${AGENT_PLATFORM_MCP_ALLOWED_COMMANDS:-[]}
      AGENT_PLATFORM_MCP_ALLOWED_WORKING_DIRECTORY_ROOTS: ${AGENT_PLATFORM_MCP_ALLOWED_WORKING_DIRECTORY_ROOTS:-[]}
    command: ["agent-platform-approval-worker"]
    volumes:
      - control_plane_objects:/var/lib/agent-platform
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  web:
    image: agent-platform/control-plane-web:local
    build:
      context: ../..
      dockerfile: deploy/control-plane/Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8088}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  control_plane_mysql:
    name: agent-platform-validation-mysql
  control_plane_objects:
    name: agent-platform-validation-objects
