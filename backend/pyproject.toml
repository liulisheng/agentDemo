[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-platform-backend"
version = "0.1.0"
description = "Enterprise Agent platform control plane"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "uvicorn[standard]>=0.30,<1",
  "cryptography>=43,<51",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<6",
  "ruff>=0.8,<1",
]
mysql = ["mysql-connector-python==9.7.0"]

[project.scripts]
agent-platform-migration = "agent_platform.infrastructure.migrations:main"
agent-platform-seed-fake-identity = "agent_platform.infrastructure.seed_fake_identity:main"
agent-platform-object-gc = "agent_platform.infrastructure.object_gc:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
